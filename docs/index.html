<body>
<div class="page">
  <div class="wrap" id="wrap">
    <header class="top">
      <span class="wordmark">trending.elie.tech</span>
      <div class="today">
        <span class="live" id="live" hidden>
          <span class="live-ping"></span>
          <span class="live-dot"></span>
        </span>
        <span class="live-wait" id="live-wait"></span>
        <span class="today-kicker">Today</span>
        <span class="today-rank" id="today-rank">…</span>
        <span class="today-lang" id="today-lang">TypeScript</span>
      </div>
    </header>

    <section class="hero" id="hero">
      <div class="skel skel-lg"></div>
      <div class="skel skel-sm"></div>
    </section>

    <section class="stats" id="stats" aria-label="Record"></section>

    <section class="chart-block">
      <div class="chart-head">
        <h2 id="chart-title">Month by month</h2>
        <div class="chart-controls">
          <div class="seg" id="mode-seg" data-key="mode">
            <button type="button" data-value="monthly" class="is-on">By month</button>
            <button type="button" data-value="cumulative">Total #1 days</button>
            <button type="button" data-value="rank">Daily rank</button>
          </div>
          <div class="seg" id="list-seg" data-key="list">
            <button type="button" data-value="typescript" class="is-on">TypeScript</button>
            <button type="button" data-value="all">All languages</button>
          </div>
          <div class="seg seg-mono" id="range-seg" data-key="range">
            <button type="button" data-value="30d">30D</button>
            <button type="button" data-value="90d">90D</button>
            <button type="button" data-value="1y">1Y</button>
            <button type="button" data-value="all" class="is-on">All</button>
          </div>
        </div>
      </div>
      <div class="chart-stage" id="chart-stage">
        <div class="skel-chart" id="chart-skel"></div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="heat-block">
      <div class="heat-head">
        <h2>Every day</h2>
        <span class="heat-caption" id="heat-caption"></span>
      </div>
      <div class="heat-scroll" id="heat-scroll"></div>
    </section>

    <section class="repos">
      <h2>Repos that trended</h2>
      <div id="repo-list">
        <div class="skel skel-repo"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-links">
        <a href="https://github.com/elie222">github.com/elie222</a>
        <a href="https://elie.tech">elie.tech</a>
      </div>
      <a class="updated" id="updated" href="https://github.com/elie222/github-trending-tracker">Updated …</a>
    </footer>
  </div>
